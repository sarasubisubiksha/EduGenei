<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduGenie Learning Assistant</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap"><header><div class="logo">✦ EduGenie</div><p>Your personal AI study companion</p></header><section class="panel"><h1>What would you like to learn?</h1><p class="muted">Ask, understand, revise, practice, and plan your learning.</p><form id="form"><label>Learning tool</label><select id="task"><option value="explain">Explain a concept</option><option value="qa">Question & Answer</option><option value="quiz">Generate Quiz</option><option value="summarize">Summarize notes</option><option value="recommend">Learning roadmap</option></select><label>Learning level</label><select id="level"><option>Beginner</option><option>School student</option><option>College student</option><option>Intermediate</option><option>Advanced</option></select><label>Topic, question, or passage</label><textarea id="text" rows="7" maxlength="20000" required placeholder="Example: Explain photosynthesis in simple words..."></textarea><div class="actions"><span id="count">0 / 20000</span><button id="send">Generate response →</button></div></form></section><section id="output" class="panel hidden" aria-live="polite"><div class="row"><h2 id="heading">Result</h2><button id="copy" class="secondary">Copy</button></div><div id="result"></div></section><footer>EduGenie · FastAPI + Google Gemini · Verify important facts with course materials.</footer></main><script src="/static/app.js"></script></body></html>
